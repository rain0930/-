<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>召喚峽谷大挑戰</title>
<style>
:root{color-scheme:light dark;--bg:#faf7ff;--fg:#1d1633;--card:#fff;--mut:#6b6485;--ac:#6d4aff;--ok:#16a34a;--bad:#dc2626;--line:#e3dcf5}
@media (prefers-color-scheme:dark){:root{--bg:#14101f;--fg:#f1edff;--card:#201a33;--mut:#a59fc0;--ac:#9b83ff;--line:#352c52}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
#app{max-width:560px;margin:0 auto;padding:20px 16px 40px}
body.host #app{max-width:900px;font-size:20px}
h1{font-size:28px;margin:8px 0 4px}h2{font-size:24px;margin:12px 0}
body.host h2{font-size:34px}
.mut{color:var(--mut);font-size:14px}body.host .mut{font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card.ok{border-color:var(--ok)}
button,input{font:inherit;border-radius:12px;border:1px solid var(--line);padding:12px 14px;background:var(--card);color:var(--fg);width:100%;margin:6px 0}
button{cursor:pointer;text-align:left}
button.main{background:var(--ac);color:#fff;border:0;text-align:center;font-weight:600}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);margin:6px 0}
button.pick,.opt.pick{border:2px solid var(--ac)}.opt.ok{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}.opt.bad{border:2px solid var(--bad)}
button:disabled{opacity:.6;cursor:default}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.me{color:var(--ac);font-weight:700}
.qimg{max-width:100%;max-height:320px;border-radius:12px;margin:8px 0;display:block}
</style>
</head>
<body>
<div id="app"><p class="mut">連線中⋯</p></div>
<script>
const host=location.pathname==="/host",key=new URLSearchParams(location.search).get("key")||"";
if(host)document.body.classList.add("host");
let uid=localStorage.getItem("uid");if(!uid){uid=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("uid",uid)}
const TYPE={choice:"選擇題",tf:"是非題",text:"填空題",order:"排序題",num:"猜數字",img:"圖片題"};
let S=null,draft=[],lastKey="",urls=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const post=(u,b)=>fetch(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>({ok:false}));
if(host)fetch("/api/info").then(r=>r.json()).then(d=>{urls=d.urls;render()});
const es=new EventSource("/events?id="+uid);
es.onmessage=e=>{S=JSON.parse(e.data);render()};
es.onerror=()=>{if(!S)$("#app").innerHTML='<p class="mut">連線失敗，請確認伺服器已啟動。</p>'};
function boardHtml(n){return `<div class="card">${(S.board||[]).slice(0,n).map((p,i)=>`<div class="row"><span class="${p.id===uid?"me":""}">${i+1}. ${esc(p.name)}</span><b>${p.s}</b></div>`).join("")||'<span class="mut">還沒有玩家</span>'}</div>`}
const ctl=l=>host?`<button class="main" onclick="act()">${l}</button>`:"";
function body(q,rev){const dis=host||!S.joined||rev;let h="";
  if(q.t==="choice"||q.t==="tf"){q.o.forEach((o,i)=>{let c="opt";if(rev){if(i===S.answer)c+=" ok";else if(S.mine===i)c+=" bad"}else if(S.mine===i)c+=" pick";
    h+=dis?`<div class="${c}">${q.t==="tf"?"":"ABCD"[i]+". "}${esc(o)}</div>`:`<button class="${c}" onclick="send(${i})">${q.t==="tf"?"":"ABCD"[i]+". "}${esc(o)}</button>`})}
  else if(q.t==="text"||q.t==="num"){
    if(!dis)h=`<input id="tx" ${q.t==="num"?'inputmode="numeric"':""} value="${S.mine!==undefined?esc(S.mine):""}" placeholder="輸入答案"><button class="main" onclick="sendTx()">送出</button>`;
    else if(host&&!rev)h='<p class="mut">玩家作答中⋯</p>';
    if(rev)h+=`<div class="card ok">正確答案：<b>${esc(S.answer)}</b>${!host&&S.mine!==undefined?`（你的答案：${esc(S.mine)}）`:""}</div>`}
  else if(q.t==="order"){
    if(host&&!rev)h=`<div class="card">${q.show.map(esc).join("、")}</div><p class="mut">玩家要依序點選，由低到高</p>`;
    else if(!host){const cur=rev?(S.mine||[]):draft;
      h=`<p class="mut">${rev?"你的順序":"依序點選，由低到高"}</p><div class="card">${cur.map((x,i)=>`${i+1}. ${esc(x)}`).join("<br>")||'<span class="mut">尚未選擇</span>'}</div>`;
      if(!rev&&S.joined)h+=q.show.filter(x=>!draft.includes(x)).map(x=>`<button onclick="pick(this.dataset.v)" data-v="${esc(x)}">${esc(x)}</button>`).join("")+`<button onclick="draft=[];render()">重選</button><button class="main" ${draft.length<q.show.length?"disabled":""} onclick="send([...draft])">送出</button>`}
    if(rev)h+=`<div class="card ok">正確順序：<b>${S.answer.map(esc).join(" → ")}</b></div>`}
  return h}
function render(){
  if(!S)return;
  const k=S.phase+S.q;
  if(k!==lastKey){lastKey=k;draft=Array.isArray(S.mine)?[...S.mine]:[]}
  else if(document.activeElement&&document.activeElement.tagName==="INPUT")return;
  const q=S.question;let h="";
  if(S.phase==="lobby"){
    h=`<h1>⚔️ 召喚峽谷大挑戰</h1><p class="mut">目前 ${S.n} 位玩家</p>`;
    if(host)h+=`<div class="card">請玩家用手機開啟：<br><b>${urls.map(esc).join("<br>")||esc(location.origin)}</b></div>`;
    else if(!S.joined)h+=`<div class="card"><input id="nm" maxlength="12" placeholder="輸入你的暱稱"><button class="main" onclick="join()">加入遊戲</button></div>`;
    else h+=`<div class="card">你已加入，等待主持人開始⋯</div>`;
    h+=`<div class="card">${(S.board||[]).map(p=>esc(p.name)).join("、")||'<span class="mut">還沒有玩家</span>'}</div>`+ctl("開始遊戲（隨機抽題）");
  }else if(q){
    const rev=S.phase==="reveal";
    h=`<p class="mut">第 ${S.q+1} / ${S.total} 題 · ${TYPE[q.img?"img":q.t]}${q.c==="a"?" · ARAM":""}${host?` · 已作答 ${S.answered} / ${S.n}`:""}</p><h2>${esc(q.q)}</h2>`;
    if(q.img)h+=`<img class="qimg" src="/images/${encodeURIComponent(q.img)}" alt="">`;
    h+=body(q,rev);
    if(!host&&!S.joined)h+='<p class="mut">你還沒加入這一局，只能觀戰。</p>';
    else if(!host&&!rev&&S.mine!==undefined)h+='<p class="mut">已送出，公布答案前都可以修改。</p>';
    if(!host&&rev&&S.joined)h+=`<div class="card ok">本題得分：<b>${S.gain}</b></div>`;
    if(rev)h+="<h2>排行榜</h2>"+boardHtml(10);
    h+=ctl(rev?(S.q+1<S.total?"下一題":"看最終結果"):"公布答案");
  }else h="<h1>🏆 最終結果</h1>"+boardHtml(30)+ctl("重新開始（重新抽題）");
  $("#app").innerHTML=h;
}
async function join(){const v=$("#nm").value.trim();if(v)await post("/api/join",{id:uid,name:v})}
function send(v){post("/api/answer",{id:uid,v})}
function sendTx(){const el=$("#tx"),v=el.value.trim();if(!v)return;el.blur();if(S.question.t==="num"){const n=Number(v);if(isNaN(n))return;send(n)}else send(v)}
function pick(x){draft=[...draft,x];render()}
async function act(){const r=await post("/api/host",{key});if(!r.ok)alert(r.error||"操作失敗")}
</script>
</body>
</html>
