<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>召喚峽谷大挑戰</title>
<style>
:root{color-scheme:light dark;--bg:#faf7ff;--fg:#1d1633;--card:#fff;--mut:#6b6485;--ac:#6d4aff;--ok:#16a34a;--bad:#dc2626;--line:#e3dcf5}
@media (prefers-color-scheme:dark){:root{--bg:#14101f;--fg:#f1edff;--card:#201a33;--mut:#a59fc0;--ac:#9b83ff;--line:#352c52}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app,#media{max-width:560px;margin:0 auto;padding:0 16px}
#app{padding-bottom:40px}
#media:not(:empty),#media:empty+#app{padding-top:20px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:22px;margin:12px 0}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card.ok{border-color:var(--ok)}.card.bad{border-color:var(--bad)}
button,input{font:inherit;border-radius:12px;border:1px solid var(--line);padding:12px 14px;background:var(--card);color:var(--fg);width:100%;margin:6px 0}
button{cursor:pointer;text-align:left}
button.main{background:var(--ac);color:#fff;border:0;text-align:center;font-weight:600}
button.pick,.opt.pick{border:2px solid var(--ac)}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);margin:6px 0}
.opt.ok{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}.opt.bad{border:2px solid var(--bad)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.me{color:var(--ac);font-weight:700}
.qimg{max-width:100%;max-height:320px;border-radius:12px;margin:8px 0;display:block}
</style>
</head>
<body>
<div id="media"></div>
<div id="app"><p class="mut">連線中⋯</p></div>
<script>
window.onerror=(m,u,l)=>{const a=document.getElementById("app");if(a)a.innerHTML='<h2>頁面發生錯誤</h2><p class="mut">請截圖這段文字給開發者：<br>'+String(m)+" (行 "+l+")</p>"};
let uid=null;try{uid=localStorage.getItem("uid")}catch(e){}
if(!uid){uid=Math.random().toString(36).slice(2)+Date.now().toString(36);try{localStorage.setItem("uid",uid)}catch(e){}}
const TYPE={choice:"選擇題",tf:"是非題",text:"填空題",order:"排序題",num:"猜數字"};
let S=null,sel,draft=[],lastKey="",mediaKey="";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function act(type,extra){
  try{const r=await fetch("/api/act",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:uid,type,...extra})});S=await r.json();render()}
  catch(e){if(!S)$("#app").innerHTML='<p class="mut">連線失敗（伺服器可能在休眠，請等 30 秒後重新整理）。<br>'+esc(e&&e.message||e)+'</p>'}}
act("state");
setInterval(()=>{if(S&&(S.state==="lobby"||S.state==="end"||S.state==="new")&&!(document.activeElement&&document.activeElement.tagName==="INPUT"))act("state")},6000);
function mediaHtml(q){let h=`<p class="mut" id="mt"></p><h2>${esc(q.q)}</h2>`;
  if(q.img)h+=`<img class="qimg" src="/images/${encodeURIComponent(q.img)}" alt="">`;
  if(q.video)h+=`<video class="qimg" src="/images/${encodeURIComponent(q.video)}" controls playsinline preload="auto"></video>`;
  if(q.yt)h+=`<iframe class="qimg" style="width:100%;aspect-ratio:16/9;border:0" src="https://www.youtube.com/embed/${encodeURIComponent(q.yt)}?playsinline=1&rel=0" allow="encrypted-media; fullscreen" allowfullscreen></iframe>`;
  return h}
function boardHtml(){const b=S.board||{top:[]};return `<h2>排行榜（最佳成績）</h2><div class="card">${b.top.map((p,i)=>`<div class="row"><span class="${p.me?"me":""}">${i+1}. ${esc(p.name)}</span><b>${p.s}</b></div>`).join("")||'<span class="mut">還沒有人完成，你可以當第一名！</span>'}</div>${b.playing?`<p class="mut">目前有 ${b.playing} 人正在挑戰</p>`:""}`}
function body(q,rev){let h="";
  if(q.t==="choice"||q.t==="tf"){q.o.forEach((o,i)=>{let c="opt",pre=q.t==="tf"?"":"ABCD"[i]+". ";
    if(rev){if(i===S.answer)c+=" ok";else if(S.mine===i)c+=" bad";h+=`<div class="${c}">${pre}${esc(o)}</div>`}
    else{if(sel===i)c+=" pick";h+=`<button class="${c}" onclick="sel=${i};render()">${pre}${esc(o)}</button>`}})}
  else if(q.t==="text"||q.t==="num"){
    if(!rev)h=`<input id="tx" ${q.t==="num"?'inputmode="numeric"':""} placeholder="輸入答案">`;
    else h=`<div class="card">你的答案：<b>${esc(S.mine)}</b></div><div class="card ok">正確答案：<b>${esc(S.answer)}</b></div>`}
  else if(q.t==="order"){const cur=rev?S.mine:draft;
    h=`<p class="mut">${rev?"你的順序":"依序點選，由弱／低到強／高"}</p><div class="card">${cur.map((x,i)=>`${i+1}. ${esc(x)}`).join("<br>")||'<span class="mut">尚未選擇</span>'}</div>`;
    if(!rev)h+=q.show.filter(x=>!draft.includes(x)).map(x=>`<button data-v="${esc(x)}" onclick="draft=[...draft,this.dataset.v];render()">${esc(x)}</button>`).join("")+`<button onclick="draft=[];render()">重選</button>`;
    else h+=`<div class="card ok">正確順序：<b>${S.answer.map(esc).join(" → ")}</b></div>`}
  return h}
function render(){
  if(!S)return;
  const q=S.question,k=S.state+S.i;
  if(k!==lastKey){lastKey=k;sel=undefined;draft=[]}
  const mk=q?S.i+"|"+q.q:"";
  if(mk!==mediaKey){mediaKey=mk;$("#media").innerHTML=q?mediaHtml(q):""}
  let h="";
  if(S.state==="new"){
    h=`<h1>⚔️ 召喚峽谷大挑戰</h1><p class="mut">自己的步調，答完比排行榜</p><div class="card"><input id="nm" maxlength="12" placeholder="輸入你的暱稱"><button class="main" onclick="join()">加入</button></div>`+boardHtml();
  }else if(S.state==="lobby"){
    h=`<h1>嗨，${esc(S.name)}！</h1><p class="mut">每場隨機抽 ${S.total||"10"} 題左右，沒有時間限制。</p><button class="main" onclick="act('start')">開始挑戰</button>`+boardHtml();
  }else if(q){
    $("#mt").textContent=`第 ${S.i+1} / ${S.total} 題 · ${TYPE[q.t]}${q.c==="a"?" · ARAM":""}${q.c==="k"?" · 英雄技能":""} · 目前 ${S.score} 分`;
    const rev=S.state==="reveal";h=body(q,rev);
    if(!rev){const ready=q.t==="choice"||q.t==="tf"?sel!==undefined:q.t==="order"?draft.length===q.show.length:true;
      h+=`<button class="main" ${ready?"":"disabled"} onclick="submit()">送出</button>`}
    else{h+=`<div class="card ${S.gain>0?"ok":"bad"}">${S.gain>=1000?"✅ 答對了！":S.gain>0?"👍 接近了！":"❌ 答錯了"} <b>+${S.gain}</b>${S.exp?`<br><span class="mut">${esc(S.exp)}</span>`:""}</div>`+
      `<button class="main" onclick="act('next')">${S.i+1<S.total?"下一題":"看結果"}</button>`}
  }else{
    h=`<h1>🏆 完成！</h1><div class="card">本次分數：<b>${S.score}</b> / ${S.total*1000}<br><span class="mut">最佳成績：${S.best}</span></div><button class="main" onclick="act('start')">再玩一次（重新抽題）</button>`+boardHtml();
  }
  $("#app").innerHTML=h;
}
function join(){const v=$("#nm").value.trim();if(v)act("join",{name:v})}
function submit(){const q=S.question;let v;
  if(q.t==="choice"||q.t==="tf")v=sel;else if(q.t==="order")v=[...draft];
  else{const t=$("#tx").value.trim();if(!t)return;v=q.t==="num"?Number(t):t;if(q.t==="num"&&isNaN(v)){alert("請輸入數字");return}}
  act("submit",{v})}
</script>
</body>
</html>
